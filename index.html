<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- SEO: il vecchio sito aveva <title>.</title> — qui lo impostiamo correttamente -->
    <title>L'Altra Osteria Roma - Cucina Tradizionale e Rivisitata</title>
    <meta
      name="description"
      content="L'Altra Osteria a Roma (Via Cassia): cucina romana e italiana tra tradizione e rivisitazione, con vini di piccoli produttori artigianali. Prenota un tavolo."
    />
    <meta name="theme-color" content="#B5512E" />

    <!-- Open Graph per anteprime social (WhatsApp, Facebook, Instagram) -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="L'Altra Osteria Roma - Cucina Tradizionale e Rivisitata" />
    <meta
      property="og:description"
      content="Cucina romana e italiana tra tradizione e rivisitazione. Via Cassia 923, Roma."
    />

    <!-- Google Fonts: Playfair Display (titoli) + Inter (testo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function(user) {
          if (!user) {
            window.netlifyIdentity.on('login', function() {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
