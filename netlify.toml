# Configurazione di build e hosting per Netlify
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA fallback: ogni rotta sconosciuta serve index.html.
# Esclude /admin/ così il pannello Decap viene servito direttamente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
