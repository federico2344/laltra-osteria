<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>L'Altra Osteria · Pannello di gestione</title>
    <style>
      /* ──────────────────────────────────────────────────────────────
         Solo lo stile del bottone Guida flottante. Il resto del tema
         (Notion/Apple light) viene iniettato da JS dopo che Decap
         monta i suoi stili — è l'unico modo per vincere emotion.
         ────────────────────────────────────────────────────────────── */
      #guida-fab {
        position: fixed; bottom: 22px; right: 22px; z-index: 99999;
        background: #8B1A1A; color: #fff; text-decoration: none;
        padding: 11px 18px; border-radius: 999px; font-weight: 500;
        font-size: 13.5px; letter-spacing: -0.005em;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        box-shadow: 0 4px 12px rgba(139, 26, 26, 0.22), 0 1px 2px rgba(0,0,0,0.05);
        display: flex; align-items: center; gap: 7px;
        transition: background-color 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #guida-fab:hover {
        background: #6B0F0F;
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(139, 26, 26, 0.28), 0 2px 4px rgba(0,0,0,0.08);
      }
      #guida-fab:active { transform: translateY(0); }
    </style>
  </head>
  <body>
    <a id="guida-fab" href="/guida-admin" target="_blank" rel="noopener" title="Apri la guida al pannello">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
      </svg>
      Guida
    </a>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // ── Stili pannello: iniezione robusta per vincere emotion ──
      (function injectAdminStyles() {
        console.log('[admin-style] init');
        var css = `
          /* ════════════════════════════════════════════════════════════════
             ADMIN UI — Reset totale, stile Notion / iOS / Apple
             Toni chiari, niente bordi pesanti, ombre quasi invisibili,
             spaziatura ariosa, hover sottilissimi.
             ════════════════════════════════════════════════════════════════ */

          :root {
            --bg: #F8F9FA;
            --surface: #ffffff;
            --surface-2: #f1f3f5;
            --ink: #1A1A1A;
            --ink-soft: #5A5F66;
            --ink-faint: #8A8F96;
            --line: rgba(20, 20, 20, 0.08);
            --divider: rgba(20, 20, 20, 0.12);
            --brand: #8B1A1A;
            --brand-dark: #6B0F0F;
            --brand-soft: rgba(139, 26, 26, 0.06);
            --brand-tint: rgba(139, 26, 26, 0.12);
            --shadow-card: 0 4px 12px rgba(0,0,0,0.05);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
          }

          /* CONTAINER MASTER — centrato, max-width 1400 */
          html body [class*="AppMainContainer"],
          html body [class*="App__Main"],
          html body main {
            max-width: 1400px !important;
            margin: 0 auto !important;
            padding: 32px 28px !important;
          }

          /* GRID 12 col: sidebar (3) + content (9) */
          html body [class*="CollectionContainer"]:not([class*="CollectionMain"]):not([class*="CollectionTop"]) {
            display: grid !important;
            grid-template-columns: minmax(220px, 3fr) 9fr !important;
            gap: 28px !important;
            align-items: start !important;
          }

          /* TYPOGRAPHY */
          html body, html body * {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
          }
          html body {
            background: var(--bg) !important;
            color: var(--ink) !important;
            letter-spacing: -0.005em;
            font-size: 14px !important;
          }
          html body h1, html body h2, html body h3, html body [class*="Heading"] {
            color: var(--ink) !important;
            letter-spacing: -0.022em !important;
          }

          /* HEADER — bianco semitrasparente, dark text */
          html body header,
          html body [class*="AppHeader"]:not([class*="Content"]):not([class*="Button"]):not([class*="Nav"]):not([class*="Actions"]) {
            background: rgba(255, 255, 255, 0.78) !important;
            -webkit-backdrop-filter: saturate(180%) blur(24px) !important;
            backdrop-filter: saturate(180%) blur(24px) !important;
            border-bottom: 1px solid var(--line) !important;
            box-shadow: none !important;
            height: 52px !important;
          }
          /* Link Contenuti — pulito, senza chrome da bottone */
          html body header [class*="AppHeaderNavLink"],
          html body header [class*="AppHeaderButton"] {
            color: var(--ink) !important;
            font-weight: 500 !important;
            font-size: 14px !important;
            background: transparent !important;
            border: none !important;
            border-radius: 6px !important;
            padding: 6px 10px !important;
            box-shadow: none !important;
            transition: background 0.15s var(--ease) !important;
          }
          html body header [class*="AppHeaderNavLink"]:hover,
          html body header [class*="AppHeaderButton"]:hover {
            background: rgba(55, 53, 47, 0.06) !important;
            color: var(--ink) !important;
            transform: none !important;
          }
          html body header [class*="AppHeaderNavLink"].header-link-active {
            background: rgba(55, 53, 47, 0.08) !important;
            color: var(--ink) !important;
          }
          /* Avatar */
          html body [class*="AvatarDropdownButton"] {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 4px !important;
          }
          html body [class*="AvatarDropdownButton"] svg path {
            fill: var(--ink-soft) !important;
          }

          /* IMPORTANTE: contenitori di LAYOUT trasparenti — niente bordo né bg */
          html body [class*="EditorContainer"],
          html body [class*="EntryFormContainer"],
          html body [class*="ControlPaneContainer"],
          html body [class*="PreviewPaneContainer"],
          html body [class*="CollectionContainer"],
          html body [class*="CollectionMainContainer"],
          html body [class*="WorkflowContainer"] {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
          }

          /* Titolo della raccolta — testo libero, niente card */
          html body [class*="CollectionTopContainer"],
          html body [class*="CollectionHeading"],
          html body [class*="CollectionTop"][class*="Container"] {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 0 0 20px !important;
          }
          html body [class*="CollectionTopContainer"] h1,
          html body [class*="CollectionTopContainer"] h2,
          html body [class*="CollectionHeading"] h1,
          html body [class*="CollectionHeading"] h2 {
            font-size: 32px !important;
            font-weight: 700 !important;
            letter-spacing: -0.022em !important;
            color: var(--ink) !important;
            margin: 0 !important;
            padding: 0 !important;
          }

          /* Card single — solo entry cards visibili, non i wrapper */
          html body [class*="EntryListing"] > [class*="StyledCard"],
          html body [class*="EntryListing"] li > [class*="Card"] {
            border-radius: 10px !important;
            border: 1px solid var(--line) !important;
            background: var(--surface) !important;
            box-shadow: none !important;
          }

          /* Bottoni di visualizzazione (lista / griglia) — segmented control */
          html body [class*="ViewControls"],
          html body [class*="ViewToggle"] {
            display: inline-flex !important;
            background: var(--surface-2) !important;
            border-radius: 8px !important;
            padding: 2px !important;
            gap: 0 !important;
          }
          html body [class*="ViewControls"] button,
          html body [class*="ViewToggle"] button {
            border: none !important;
            background: transparent !important;
            border-radius: 6px !important;
            padding: 6px 10px !important;
            color: var(--ink-soft) !important;
            box-shadow: none !important;
          }
          html body [class*="ViewControls"] button[class*="active"],
          html body [class*="ViewToggle"] button[class*="active"],
          html body [class*="ViewControls"] [class*="selected"] {
            background: var(--surface) !important;
            color: var(--ink) !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06) !important;
          }

          /* "Ordina per" pulsante */
          html body [class*="SortControl"] button,
          html body button[class*="Sort"] {
            background: transparent !important;
            border: 1px solid var(--line) !important;
            color: var(--ink-soft) !important;
            font-weight: 500 !important;
            padding: 6px 12px !important;
            border-radius: 8px !important;
          }
          html body [class*="SortControl"] button:hover,
          html body button[class*="Sort"]:hover {
            background: var(--surface-2) !important;
          }

          /* SIDEBAR "Raccolte" — card flat con ombra leggera */
          html body [class*="CollectionTop"]:not([class*="Container"]),
          html body [class*="SidebarContainer"] {
            background: var(--surface) !important;
            border-radius: 12px !important;
            border: 1px solid var(--line) !important;
            box-shadow: var(--shadow-card) !important;
            padding: 12px !important;
            position: sticky !important;
            top: 76px !important;
          }
          /* "RACCOLTE" header — modern caps */
          html body [class*="CollectionTop"] h2,
          html body [class*="Sidebar"] h2 {
            font-size: 10.5px !important;
            font-weight: 700 !important;
            letter-spacing: 0.12em !important;
            color: var(--ink-faint) !important;
            text-transform: uppercase !important;
            padding: 8px 10px 14px !important;
            margin: 0 !important;
          }

          /* SIDEBAR ITEMS — pill, align center, padding ariosa */
          html body [class*="NavLink"],
          html body [class*="CollectionListItem"],
          html body a[class*="SidebarNavLink"] {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            border-radius: 8px !important;
            padding: 10px 12px !important;
            margin: 2px 0 !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            color: var(--ink) !important;
            background: transparent !important;
            border: none !important;
            border-left: 3px solid transparent !important;
            transition: background-color 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease) !important;
            position: relative !important;
          }
          html body [class*="NavLink"]:hover,
          html body [class*="CollectionListItem"]:hover {
            background-color: var(--surface-2) !important;
            color: var(--ink) !important;
            transform: none !important;
          }
          html body [class*="NavLink"][class*="active"],
          html body [class*="CollectionListItem"][class*="active"],
          html body [class*="NavLink"][aria-current="page"],
          html body a[class*="SidebarNavLink"][aria-current="page"],
          html body [class*="CollectionListItem"][class*="Active"] {
            background-color: var(--brand-soft) !important;
            color: var(--brand) !important;
            font-weight: 600 !important;
            border-left-color: var(--brand) !important;
            padding-left: 9px !important;
          }

          /* SEARCH input */
          html body [class*="CollectionSearch"] input,
          html body input[type="search"] {
            border: 1px solid transparent !important;
            background: var(--surface-2) !important;
            border-radius: 6px !important;
            padding: 6px 12px 6px 32px !important;
            font-size: 14px !important;
            color: var(--ink) !important;
            transition: background 0.15s var(--ease), border-color 0.15s var(--ease) !important;
          }
          html body input[type="search"]:focus {
            background: var(--surface) !important;
            border-color: var(--line) !important;
            box-shadow: 0 0 0 2px var(--brand-soft) !important;
          }

          /* INPUTS / TEXTAREA / SELECT */
          html body input[type="text"],
          html body input[type="email"],
          html body input[type="password"],
          html body input[type="number"],
          html body input[type="url"],
          html body textarea,
          html body select {
            border-radius: 6px !important;
            border: 1px solid var(--line) !important;
            background: var(--surface) !important;
            padding: 8px 12px !important;
            font-size: 14px !important;
            color: var(--ink) !important;
            transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease) !important;
          }
          html body input:focus,
          html body textarea:focus,
          html body select:focus {
            outline: none !important;
            border-color: var(--brand) !important;
            box-shadow: 0 0 0 3px var(--brand-soft) !important;
          }

          /* BUTTONS — default secondario */
          html body button,
          html body [class*="Button"] {
            border-radius: 6px !important;
            font-weight: 500 !important;
            font-size: 14px !important;
            padding: 7px 14px !important;
            border: 1px solid var(--line) !important;
            background: var(--surface) !important;
            color: var(--ink) !important;
            box-shadow: none !important;
            transition: background 0.15s var(--ease), border-color 0.15s var(--ease) !important;
          }
          html body button:hover,
          html body [class*="Button"]:hover {
            background: var(--surface-2) !important;
            transform: none !important;
          }
          html body button:active {
            background: var(--surface-2) !important;
            transform: none !important;
          }

          /* BOTTONI PRIMARI rossi */
          html body [class*="primary"][class*="Button"],
          html body [class*="Button"][class*="primary"],
          html body button[class*="success"] {
            background: var(--brand) !important;
            color: #fff !important;
            border-color: transparent !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04) !important;
          }
          html body [class*="primary"][class*="Button"]:hover,
          html body [class*="Button"][class*="primary"]:hover,
          html body button[class*="success"]:hover {
            background: var(--brand-dark) !important;
          }

          /* LIST ITEMS (es. "Dati principali") — card vera con ombra leggera */
          html body [class*="EntryListing"] [class*="ListItem"] {
            background: var(--surface) !important;
            border-radius: 12px !important;
            border: 1px solid var(--line) !important;
            padding: 24px 28px !important;
            font-weight: 500 !important;
            font-size: 15px !important;
            box-shadow: var(--shadow-card) !important;
            transition: box-shadow 0.18s var(--ease), transform 0.18s var(--ease) !important;
          }
          html body [class*="EntryListing"] [class*="ListItem"]:hover {
            background: var(--surface) !important;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.06) !important;
          }
          /* List items dentro ai form (NON entry cards) restano piatti */
          html body [class*="ListControl"] [class*="ListItem"],
          html body [class*="ObjectControl"] [class*="ListItem"] {
            background: var(--surface) !important;
            border-radius: 8px !important;
            border: 1px solid var(--line) !important;
            padding: 10px 14px !important;
            box-shadow: none !important;
          }

          /* LIST ITEM TOP BAR (sezioni collassate) */
          html body [class*="ListItemTopBar"] {
            border-radius: 6px !important;
            border: 1px solid var(--line) !important;
            background: var(--surface) !important;
            box-shadow: none !important;
            transition: background 0.12s var(--ease) !important;
          }
          html body [class*="ListItemTopBar"]:hover {
            background: var(--surface-2) !important;
          }

          /* LABELS dei campi */
          html body [class*="ControlLabel"],
          html body label[class*="Label"] {
            font-weight: 500 !important;
            font-size: 13px !important;
            color: var(--ink-soft) !important;
            letter-spacing: 0 !important;
            text-transform: none !important;
          }

          /* HINTS sotto i campi */
          html body [class*="ControlHint"],
          html body [class*="FieldHint"] {
            font-size: 12.5px !important;
            color: var(--ink-faint) !important;
            margin-top: 6px !important;
          }

          /* DROPDOWN menu (es. Esci, Ordina per) */
          html body [class*="DropdownList"] {
            border-radius: 10px !important;
            border: 1px solid var(--line) !important;
            background: var(--surface) !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05) !important;
            padding: 4px !important;
          }
          html body [class*="DropdownList"] [role="menuitem"],
          html body [class*="DropdownList"] [class*="dropdownItem"],
          html body [class*="StyledMenuItem"] {
            border-radius: 6px !important;
            padding: 8px 12px !important;
            font-size: 14px !important;
            transition: background 0.1s var(--ease) !important;
            cursor: pointer !important;
          }
          html body [class*="DropdownList"] [role="menuitem"]:hover,
          html body [class*="StyledMenuItem"]:hover {
            background: var(--surface-2) !important;
          }

          /* "Ordina per" link */
          html body [class*="SortControl"], html body [class*="SortButton"] {
            color: var(--ink-soft) !important;
            font-weight: 500 !important;
          }

          /* SCROLLBAR */
          ::-webkit-scrollbar { width: 10px; height: 10px; }
          ::-webkit-scrollbar-track { background: transparent; }
          ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.12);
            border-radius: 5px;
            border: 2px solid transparent;
            background-clip: padding-box;
          }
          ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.22);
            background-clip: padding-box;
            border: 2px solid transparent;
          }

          /* COMPARSA dolce del contenuto principale */
          html body [class*="EditorContainer"],
          html body [class*="CollectionMainContainer"],
          html body [class*="CollectionContainer"] > *:not([class*="Sidebar"]):not([class*="CollectionTop"]) {
            animation: adminFadeIn 0.22s var(--ease);
          }
          @keyframes adminFadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
          }

          /* HIDE: Media tab, ricerca globale, controlli inutili per file-collections */
          html body a[href="#/media"],
          html body [class*="AppHeaderNavList"] > li:nth-child(2),
          html body input[placeholder*="Cerca su tutto"],
          html body form[role="search"],
          /* Sort, view toggle (lista/griglia): inutili per raccolte con 1 file */
          html body [class*="SortControl"],
          html body [class*="ViewControls"],
          html body [class*="ViewToggle"],
          html body button[class*="ViewStyle"],
          html body [class*="ViewStyle"],
          html body button[aria-label*="lista"],
          html body button[aria-label*="griglia"],
          html body button[aria-label*="list"],
          html body button[aria-label*="grid"],
          /* Icona libro-matita Decap accanto a ogni voce sidebar */
          html body [class*="CollectionListItem"] svg,
          html body [class*="NavLink"] > svg:first-child,
          html body [class*="SidebarNavLink"] > svg:first-child {
            display: none !important;
          }

          /* TOOLBAR salva/pubblica — discreta */
          html body [class*="EditorToolbar"] {
            background: rgba(255, 255, 255, 0.85) !important;
            -webkit-backdrop-filter: saturate(180%) blur(16px) !important;
            backdrop-filter: saturate(180%) blur(16px) !important;
            border-bottom: 1px solid var(--line) !important;
            box-shadow: none !important;
          }

          /* MOTION più fluida e meno meccanica */
          html body * {
            transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1) !important;
          }

          /* Comparsa più morbida quando cambi sezione */
          html body [class*="EditorContainer"] > *,
          html body [class*="CollectionMainContainer"] > * {
            animation: adminSlideIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
          }
          @keyframes adminSlideIn {
            0%   { opacity: 0; transform: translateY(8px) scale(0.997); filter: blur(2px); }
            60%  { filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
          }

          /* Stagger leggero per le voci della sidebar al primo load */
          html body [class*="CollectionListItem"]:nth-child(1) { animation: itemFade 0.35s 0.02s cubic-bezier(0.22, 1, 0.36, 1) both; }
          html body [class*="CollectionListItem"]:nth-child(2) { animation: itemFade 0.35s 0.06s cubic-bezier(0.22, 1, 0.36, 1) both; }
          html body [class*="CollectionListItem"]:nth-child(3) { animation: itemFade 0.35s 0.10s cubic-bezier(0.22, 1, 0.36, 1) both; }
          html body [class*="CollectionListItem"]:nth-child(4) { animation: itemFade 0.35s 0.14s cubic-bezier(0.22, 1, 0.36, 1) both; }
          @keyframes itemFade {
            from { opacity: 0; transform: translateX(-4px); }
            to   { opacity: 1; transform: translateX(0); }
          }
        `;

        function ensureLast() {
          var existing = document.getElementById('admin-custom-style');
          if (existing) existing.parentNode.removeChild(existing);
          var s = document.createElement('style');
          s.id = 'admin-custom-style';
          s.textContent = css;
          document.head.appendChild(s);
          console.log('[admin-style] injected, head children:', document.head.children.length);
        }

        ensureLast();

        // Riposiziona sempre i nostri stili come ULTIMI in head
        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              if (added[j].id !== 'admin-custom-style' &&
                  added[j].tagName === 'STYLE') {
                // emotion ha aggiunto uno style → reinseriamo i nostri in coda
                requestAnimationFrame(ensureLast);
                return;
              }
            }
          }
        });
        observer.observe(document.head, { childList: true });
      })();

      // ── Stile anteprime ──────────────────────────────────────────────────
      CMS.registerPreviewStyle(`
        * { box-sizing: border-box; }
        body {
          font-family: Georgia, 'Times New Roman', serif;
          background: #FAF6F0;
          color: #2B2622;
          padding: 2rem;
          margin: 0;
        }
        .eyebrow {
          font-size: 0.7rem;
          font-weight: 700;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #8B1A1A;
          margin-bottom: 0.5rem;
        }
        h1 { font-size: 2rem; margin: 0 0 0.5rem; color: #2B2622; }
        h2 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #8B1A1A; border-bottom: 1px solid #e0d5c5; padding-bottom: 0.4rem; margin: 1.5rem 0 0.75rem; }
        h3 { font-size: 1rem; margin: 0 0 0.2rem; color: #2B2622; }
        p { margin: 0.25rem 0; color: #5a5050; font-size: 0.9rem; line-height: 1.5; }
        .card { background: white; border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .row { display: flex; justify-content: space-between; align-items: baseline; padding: 0.6rem 0; border-bottom: 1px solid #f0ebe3; }
        .row:last-child { border-bottom: none; }
        .price { color: #B8872A; font-weight: 700; font-size: 1rem; white-space: nowrap; margin-left: 1rem; }
        .fixed-price { color: #8B1A1A; font-size: 0.9rem; font-weight: 600; }
        .note { font-style: italic; color: #888; font-size: 0.82rem; margin-bottom: 0.5rem; }
        .photo { width: 100%; max-width: 280px; border-radius: 12px; object-fit: cover; aspect-ratio: 3/4; }
        .team-card { display: flex; gap: 1.5rem; align-items: flex-start; }
        .team-info { flex: 1; }
        .info-row { display: flex; gap: 0.5rem; margin-bottom: 0.4rem; font-size: 0.9rem; }
        .label { font-weight: 600; min-width: 90px; color: #555; }
        .tag { background: #FAF6F0; border: 1px solid #B8872A; color: #B8872A; padding: 2px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; display: inline-block; margin-bottom: 0.75rem; }
        .empty { color: #aaa; font-style: italic; text-align: center; padding: 2rem; }
      `, { raw: true });

      // ── Helper ───────────────────────────────────────────────────────────
      var h = window.h;
      var fmt = function(n) {
        if (n == null || n === '') return '';
        return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(n);
      };

      // ── Anteprima MENÙ ───────────────────────────────────────────────────
      var MenuPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var categories = entry.getIn(['data', 'categories']);
          if (!categories || !categories.size) return h('p', { className: 'empty' }, 'Nessun dato da mostrare.');

          return h('div', {},
            categories.map(function(cat, ci) {
              var sections = cat.get('sections');
              return h('div', { key: ci },
                h('div', { className: 'eyebrow' }, cat.get('title') || '—'),
                h('p', {}, cat.get('description') || ''),
                sections && sections.map(function(sec, si) {
                  var dishes = sec.get('dishes');
                  var fp = sec.get('fixedPrice');
                  return h('div', { key: si, className: 'card' },
                    sec.get('title') && h('h2', {}, sec.get('title')),
                    fp && h('p', { className: 'fixed-price' }, '€ ' + fp + ' a persona'),
                    sec.get('note') && h('p', { className: 'note' }, sec.get('note')),
                    dishes && dishes.map(function(dish, di) {
                      return h('div', { key: di, className: 'row' },
                        h('div', {},
                          h('h3', {}, dish.get('name') || '—'),
                          dish.get('description') && h('p', {}, dish.get('description'))
                        ),
                        dish.get('price') != null && h('span', { className: 'price' }, fmt(dish.get('price')))
                      );
                    })
                  );
                })
              );
            })
          );
        }
      });
      CMS.registerPreviewTemplate('menu', MenuPreview);

      // ── Anteprima VINI ───────────────────────────────────────────────────
      var WinesPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var sections = entry.getIn(['data', 'sections']);
          if (!sections || !sections.size) return h('p', { className: 'empty' }, 'Nessun dato da mostrare.');

          return h('div', {},
            entry.getIn(['data', 'intro']) && h('p', { style: { fontStyle: 'italic', marginBottom: '1.5rem' } }, entry.getIn(['data', 'intro'])),
            sections.map(function(sec, si) {
              var items = sec.get('items');
              var subs = sec.get('subsections');
              return h('div', { key: si },
                h('h2', {}, sec.get('title') || '—'),
                items && items.size > 0 && h('div', { className: 'card' },
                  items.map(function(wine, wi) {
                    return h('div', { key: wi, className: 'row' },
                      h('div', {},
                        h('h3', {}, wine.get('name') || '—'),
                        wine.get('description') && h('p', {}, wine.get('description'))
                      ),
                      h('span', { className: 'price' }, fmt(wine.get('price')))
                    );
                  })
                ),
                subs && subs.map(function(sub, subi) {
                  return h('div', { key: subi },
                    h('h2', { style: { fontSize: '0.9rem' } }, sub.get('title') || '—'),
                    h('div', { className: 'card' },
                      sub.get('items') && sub.get('items').map(function(wine, wi) {
                        return h('div', { key: wi, className: 'row' },
                          h('div', {},
                            h('h3', {}, wine.get('name') || '—'),
                            wine.get('description') && h('p', {}, wine.get('description'))
                          ),
                          h('span', { className: 'price' }, fmt(wine.get('price')))
                        );
                      })
                    )
                  );
                })
              );
            })
          );
        }
      });
      CMS.registerPreviewTemplate('wines', WinesPreview);

      // ── Anteprima TEAM ───────────────────────────────────────────────────
      var TeamPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var people = entry.getIn(['data', 'people']);
          var getAsset = this.props.getAsset;
          if (!people || !people.size) return h('p', { className: 'empty' }, 'Nessun dato da mostrare.');

          return h('div', {},
            people.map(function(person, i) {
              var photo = person.get('photo');
              var photoUrl = photo && getAsset ? getAsset(photo) : photo;
              return h('div', { key: i, className: 'card' },
                h('div', { className: 'team-card' },
                  photo && h('img', { src: photoUrl && photoUrl.toString ? photoUrl.toString() : photoUrl, className: 'photo', alt: '' }),
                  h('div', { className: 'team-info' },
                    h('span', { className: 'tag' }, person.get('role') || ''),
                    h('h1', { style: { fontSize: '1.4rem' } }, person.get('name') || '—'),
                    h('p', {}, person.get('text') || '')
                  )
                )
              );
            })
          );
        }
      });
      CMS.registerPreviewTemplate('team', TeamPreview);

      // ── Anteprima RISTORANTE ─────────────────────────────────────────────
      var RestaurantPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var data = entry.get('data');
          var addr = data.get('address');
          var hours = data.get('hours');
          var social = data.get('social');
          var slides = data.get('heroSlides');
          var getAsset = this.props.getAsset;

          return h('div', {},
            slides && slides.size > 0 && h('div', {},
              h('h2', {}, 'Slideshow home'),
              h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: '0.5rem', marginBottom: '1.5rem' } },
                slides.map(function(src, i) {
                  var url = src && (typeof src === 'string' ? src : src.get && src.get('src'));
                  if (!url) return null;
                  var asset = getAsset ? getAsset(url) : url;
                  return h('div', { key: i, style: { position: 'relative', aspectRatio: '16/10', borderRadius: '8px', overflow: 'hidden', background: '#eee' } },
                    h('img', { src: asset.toString ? asset.toString() : asset, style: { width: '100%', height: '100%', objectFit: 'cover' } }),
                    h('div', { style: { position: 'absolute', top: 6, left: 6, background: 'rgba(0,0,0,0.6)', color: 'white', padding: '2px 8px', borderRadius: '10px', fontSize: '0.7rem', fontWeight: 700 } }, 'Foto ' + (i + 1))
                  );
                })
              )
            ),
            h('div', { className: 'eyebrow' }, addr ? addr.get('street') + ' · Roma' : ''),
            h('h1', {}, data.get('name') || '—'),
            h('p', { style: { fontStyle: 'italic', marginBottom: '1.5rem' } }, data.get('tagline') || ''),
            h('p', {}, data.get('intro') || ''),

            h('h2', {}, 'Contatti'),
            h('div', { className: 'card' },
              h('div', { className: 'info-row' }, h('span', { className: 'label' }, 'Telefono:'), h('span', {}, data.get('phone') || '—')),
              h('div', { className: 'info-row' }, h('span', { className: 'label' }, 'Email:'), h('span', {}, data.get('email') || '—'))
            ),

            hours && hours.size > 0 && h('div', {},
              h('h2', {}, 'Orari'),
              h('div', { className: 'card' },
                hours.map(function(row, i) {
                  return h('div', { key: i, className: 'info-row' },
                    h('span', { className: 'label' }, row.get('day') + ':'),
                    row.get('closed')
                      ? h('span', { style: { color: '#8B1A1A' } }, 'Chiuso')
                      : h('span', {}, (row.get('lunch') || '') + (row.get('lunch') && row.get('dinner') ? ' · ' : '') + (row.get('dinner') || ''))
                  );
                })
              )
            ),

            social && h('div', {},
              h('h2', {}, 'Social'),
              h('div', { className: 'card' },
                h('div', { className: 'info-row' }, h('span', { className: 'label' }, 'Instagram:'), h('span', {}, social.get('instagram') || '—')),
                h('div', { className: 'info-row' }, h('span', { className: 'label' }, 'Facebook:'), h('span', {}, social.get('facebook') || '—')),
                h('div', { className: 'info-row' }, h('span', { className: 'label' }, 'Tripadvisor:'), h('span', {}, social.get('tripadvisor') || '—'))
              )
            )
          );
        }
      });
      CMS.registerPreviewTemplate('restaurant', RestaurantPreview);
    </script>
  </body>
</html>
